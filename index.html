<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5efe5">
<title>CL 9戦換算チェッカー</title>
<style>
:root{
  --bg:#f5efe5;--card:#fffdf9;--ink:#24211d;--muted:#756f67;
  --line:#ddd4c8;--accent:#d5782d;--good:#2f7a4c;--warn:#a8611c;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}
.app{max-width:720px;margin:auto;padding:18px 14px 42px}
h1{font-size:24px;margin:6px 0 4px}
.sub{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:16px;margin:12px 0;box-shadow:0 5px 18px rgba(0,0,0,.035)
}
.sectionTitle{font-size:14px;font-weight:800;margin-bottom:10px}
.row{
  display:grid;grid-template-columns:minmax(0,1fr) 62px 62px 36px;
  gap:7px;align-items:center;margin:8px 0
}
input{
  width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;
  padding:11px 9px;font-size:16px;color:var(--ink)
}
input[type=number]{text-align:center}
button{
  border:0;border-radius:11px;padding:11px 12px;font-weight:800;font-size:14px;
  background:#2d2923;color:white
}
button.light{background:#eee6da;color:#49423a}
button.danger{background:#f3e8dd;color:#8e4f2c;padding:10px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.metric{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px
}
.metric .k{font-size:11px;color:var(--muted);margin-bottom:5px}
.metric .v{font-size:24px;font-weight:900}
.hero{
  margin-top:12px;text-align:center;background:#f1e7d8;border-radius:16px;padding:17px 10px
}
.hero small{color:var(--muted)}
.hero .record{font-size:42px;font-weight:950;line-height:1.15;margin:4px 0}
.hero .status{font-size:14px;font-weight:900}
.good{color:var(--good)} .warn{color:var(--warn)}
.bar{height:12px;background:#e5dbcd;border-radius:999px;overflow:hidden;margin:12px 0 4px}
.bar>div{height:100%;background:var(--accent);width:0;transition:.25s}
.foot{font-size:11px;color:var(--muted);line-height:1.65}
.badge{
  display:inline-block;padding:5px 9px;border-radius:999px;background:#eee6da;
  font-size:12px;font-weight:800;margin-bottom:7px
}
@media(max-width:520px){
  .app{padding-left:12px;padding-right:12px}
  .row{grid-template-columns:minmax(0,1fr) 56px 56px 34px}
  .grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
  <h1>CL 9戦換算チェッカー</h1>
  <div class="sub">ジムバ・トレリ・自主大会の戦績を、CL横浜「9戦で7勝」のペースに換算します。</div>

  <div class="card">
    <div class="sectionTitle">戦績を入力</div>
    <div id="rows"></div>
    <div class="actions">
      <button class="light" onclick="addRow()">＋ 大会を追加</button>
      <button class="light" onclick="loadSample()">直近3日を入力</button>
      <button class="light" onclick="clearAll()">クリア</button>
    </div>
  </div>

  <div class="card">
    <span class="badge">CL基準：7勝 / 9戦 = 77.8%</span>
    <div class="grid">
      <div class="metric"><div class="k">合計戦績</div><div class="v" id="total">—</div></div>
      <div class="metric"><div class="k">勝率</div><div class="v" id="rate">—</div></div>
      <div class="metric"><div class="k">9戦期待勝数</div><div class="v" id="exp">—</div></div>
      <div class="metric"><div class="k">7勝以上の単純確率</div><div class="v" id="p7">—</div></div>
    </div>

    <div class="hero">
      <small>CL 9戦換算</small>
      <div class="record" id="proj">—</div>
      <div class="status" id="status">戦績を入力してください</div>
    </div>
    <div class="bar"><div id="bar"></div></div>
    <div class="foot">入力内容はこの端末のブラウザ内に自動保存されます。</div>
  </div>

  <div class="card foot">
    「9戦期待勝数」は、現在の勝率×9で算出します。「7勝以上の単純確率」は各試合の勝率が一定と仮定した二項分布です。実際のCLはスイスドローで相手の強さが一定ではないため、調整の目安として使ってください。
  </div>
</div>

<script>
const KEY="cl9_records_v2";
let data=[];

function save(){ localStorage.setItem(KEY,JSON.stringify(data)); }
function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||"null");
    if(Array.isArray(x)) data=x;
  }catch(e){}
  if(!data.length) data=[
    {name:"ジムバ①",w:3,l:1},
    {name:"ジムバ②",w:4,l:0},
    {name:"ジムバ③",w:3,l:1}
  ];
  render();
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function render(){
  const root=document.getElementById("rows"); root.innerHTML="";
  data.forEach((r,i)=>{
    const d=document.createElement("div"); d.className="row";
    d.innerHTML=`
      <input value="${esc(r.name)}" aria-label="大会名" oninput="edit(${i},'name',this.value)">
      <input type="number" min="0" inputmode="numeric" value="${r.w}" aria-label="勝" oninput="edit(${i},'w',this.value)">
      <input type="number" min="0" inputmode="numeric" value="${r.l}" aria-label="敗" oninput="edit(${i},'l',this.value)">
      <button class="danger" onclick="removeRow(${i})">×</button>`;
    root.appendChild(d);
  });
  calc(); save();
}
function addRow(){data.push({name:"大会",w:0,l:0});render();}
function removeRow(i){data.splice(i,1);render();}
function clearAll(){data=[];addRow();}
function loadSample(){
  data=[
    {name:"ジムバ①",w:3,l:1},
    {name:"ジムバ②",w:4,l:0},
    {name:"ジムバ③",w:3,l:1}
  ]; render();
}
function edit(i,k,v){
  data[i][k]=k==="name"?v:Math.max(0,Number(v)||0);
  calc(); save();
}
function C(n,k){
  if(k<0||k>n)return 0;
  let r=1;
  for(let i=1;i<=k;i++)r=r*(n-k+i)/i;
  return r;
}
function prob7(p){
  let s=0;
  for(let k=7;k<=9;k++)s+=C(9,k)*p**k*(1-p)**(9-k);
  return s;
}
function calc(){
  let W=0,L=0;
  data.forEach(r=>{W+=Number(r.w)||0;L+=Number(r.l)||0});
  const N=W+L;
  const ids=["total","rate","exp","p7","proj"];
  if(!N){
    ids.forEach(x=>document.getElementById(x).textContent="—");
    const st=document.getElementById("status");st.textContent="戦績を入力してください";st.className="status";
    document.getElementById("bar").style.width="0%";return;
  }
  const p=W/N, e=9*p, rw=Math.round(e), rl=9-rw, t=7/9;
  document.getElementById("total").textContent=`${W}-${L}`;
  document.getElementById("rate").textContent=(p*100).toFixed(1)+"%";
  document.getElementById("exp").textContent=e.toFixed(2);
  document.getElementById("p7").textContent=(prob7(p)*100).toFixed(1)+"%";
  document.getElementById("proj").textContent=`${rw}-${rl}`;
  const st=document.getElementById("status");
  if(p>=t){
    st.textContent=`DAY2ペース　＋${((p-t)*100).toFixed(1)}pt`;
    st.className="status good";
  }else{
    st.textContent=`7勝ペースまであと ${((t-p)*100).toFixed(1)}pt`;
    st.className="status warn";
  }
  document.getElementById("bar").style.width=Math.min(100,p/t*100)+"%";
}
load();
</script>
</body>
</html>
